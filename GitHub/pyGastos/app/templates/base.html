<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>pyGastos Lite</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
        <link rel="icon" href="{{ url_for('static', filename='imgs/logo.png') }}" type="image/png">
        {% block head %}{% endblock %} <!-- Jinja -->
        <!-- Use head for things like <title>, <meta>, <link> to CSS and <script> -->

        <style>
            .flash {
                padding: 10px;
                margin: 10px 0;
                border-radius: 5px;
            }
            .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
            .flash.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
            .flash.warning { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
            .flash.info    { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
        </style>

    </head>
    <body>
        <h1>pyGastos Lite</h1>
        <nav>
            <a href="{{ url_for('main.index') }}">Inicio</a>
            <a href="{{ url_for('main.tables') }}">Tablas</a>
            <a href="{{ url_for('main.add_entry') }}">Añadir entrada</a>
            <a href="{{ url_for('main.sync') }}">Sync</a>
        </nav>
        <hr>

        <!-- flash message: temporal message in next request -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block body %}{% endblock %}
    </body>
</html>
